name: linux-assets

# Linux 用の凍結ビルド（実行ファイルバンドルと AI ボイスパック）を GitHub 上で作ります。
# PyInstaller は動かした OS 用の実行ファイルしか作れないので、Windows 手元では Docker が
# 要ります。Docker のディスクイメージは C: に載って配布物ごとに太るため、CI の方が
# ローカルを汚さず再現できます（`tools/build_linux_bundles.py` の --engine local 経由）。
#
# 使い方（タグ push では動きません。既存リリースへの後付け追加用）:
#   Actions → linux-assets → Run workflow → tag を入力
#   dry_run のままならリリースへ触れず、Artifacts だけに成果物を残します
#
# 注意: このワークフローは初回実行前の状態です（ローカルでは Docker 経路のみ実測済み）。
# 初回失敗時もリリースを壊さないように workflow_dispatch 限定にしてあります。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "対象タグ（例: v0.13.2）"
        required: true
        default: "v0.13.2"
      dry_run:
        description: "作成のみ（リリースへ添付しない）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ビルドも起動確認も、Docker 経路と同じ一覧（tools/build_linux_bundles.py の
      # RUNTIME_APT）を単一の出所から入れます。リストを2箇所に写すと必ず片方が古くなる
      - name: システムライブラリ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(python -c \
            "import sys; sys.path.insert(0, 'tools'); from build_linux_bundles import RUNTIME_APT; print(' '.join(RUNTIME_APT))")
      - name: アプリ本体バンドルを作る
        run: >-
          python tools/build_linux_bundles.py --tag "${{ inputs.tag }}"
          --kind app --engine local
      # 凍結アプリを headless で起動確認。ビルドしたランナー上で走らせても、その
      # glibc が必要になるのは自明なので意味がありません。ubuntu-24.04 で作ると
      # GLIBC_2.38 無しの Debian 12 が起動できない実測があり、ビルドは ubuntu-22.04、
      # 起動確認は一段古い Debian bookworm のコンテナでやります（買い手の下限）
      - name: Debian bookworm で起動確認
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.12-bookworm bash -ec '
            apt-get update -qq >/dev/null
            apt-get install -y -qq libportaudio2 libgl1 libegl1 libglib2.0-0 \
              libxkbcommon0 libdbus-1-3 fontconfig >/dev/null
            mkdir -p /tmp/app
            tar -xzf /work/dist/linux/koeiro-${{ inputs.tag }}-linux-app.tar.gz -C /tmp/app
            QT_QPA_PLATFORM=offscreen /tmp/app/Koeiro/Koeiro --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: koeiro-${{ inputs.tag }}-linux-app
          path: dist/linux/*
      - name: リリースへ添付
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/linux/* --clobber

  pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # AI 環境・MeanVC2 のリポジトリとチェックポイント・LavaSR を揃える。
      # setup_release が作った vc_models/meanvc2/.venv の python で凍結するので、
      # CI のワーカーは実行環境の Python バージョンが手元（3.11）とずれる点に注意。
      # setup_release は LavaSR を uv + git で取りに来る（ubuntu ランナーに uv は無い）。
      # setup_release の検証は sounddevice を import するので libportaudio も要る
      # （PortAudio library not found で落ちた実測）
      - name: uv と PortAudio を入れる
        run: |
          python -m pip install --quiet uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2
      - name: AI 環境とモデルを揃える
        run: python tools/setup_release.py
      - name: ワーカーを凍結する
        run: >-
          vc_models/meanvc2/.venv/bin/python -m pip install --no-cache-dir -q pyinstaller
          && vc_models/meanvc2/.venv/bin/python -m PyInstaller KoeiroWorker.spec
          --noconfirm --log-level WARN
      - name: AI ボイスパックを作る
        run: >-
          python tools/build_linux_bundles.py --tag "${{ inputs.tag }}"
          --kind pack --worker-dist dist/KoeiroWorker --engine local
      - uses: actions/upload-artifact@v4
        with:
          name: koeiro-${{ inputs.tag }}-linux-ai-pack
          path: dist/linux/*
      - name: リリースへ添付
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/linux/* --clobber
