[pytest]
testpaths = tests
addopts = -ra
# An unclosed file/socket is a bug the suite must not absorb: the same mistake in the
# audio callback path surfaced only as a warning in a live log. Gate it here so a
# local run and CI judge it the same way (`-X dev` in CI just makes them fire).
# The second line matters: a ResourceWarning raised from __del__ arrives as an
# unraisable exception, which pytest re-labels PytestUnraisableExceptionWarning.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
